# Version catalogue. The AGP/Kotlin/Compose/Gradle combination below is a proven
# set: AGP 8.9.1 on Gradle 8.13 (AGP 8.x must not run on Gradle 9), Kotlin 2.1.20
# with the Compose compiler plugin, Compose BOM 2025.04.01. Change one and the
# build has to be re-proven.
[versions]
agp = "8.9.1"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
composeBom = "2025.04.01"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
navigation = "2.8.9"
adaptive = "1.1.0"
room = "2.7.1"
okhttp = "4.12.0"
retrofit = "2.11.0"
serialization = "1.8.0"
retrofitSerialization = "1.0.0"
work = "2.10.0"
glance = "1.1.1"
datastore = "1.1.3"
securityCrypto = "1.1.0-alpha06"
coroutines = "1.10.1"
# Coil 3.2.0, released 2025-04-22 — pinned exactly, and old enough to have been
# shipped by other people before it is shipped here. Coil 3 is the first version
# whose network layer is pluggable, which is what lets this app point it at the
# user's own OkHttp client and nowhere else.
coil = "3.2.0"
# CameraX 1.4.1 (January 2025) and ML Kit barcode-scanning 17.3.0 (July 2024) —
# both pinned exactly and both long enough in the wild to have been shipped by
# other people first. `barcode-scanning` is the **bundled** model: the detector
# ships inside the APK, so a first run needs no network and no Play Services
# download, which is the whole point of the QR being the primary pairing path.
camerax = "1.4.1"
mlkitBarcode = "17.3.0"
junit = "4.13.2"
turbine = "1.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "adaptive" }
androidx-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "adaptive" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Glance is the native replacement for the old app's react-native-android-widget.
# An app widget is RemoteViews, not Compose: Glance compiles a composition down
# to RemoteViews, which is why its modifier vocabulary is much narrower than
# Compose's (no weights with a fraction, no Canvas) — see widget/.
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Coil: the only image library in the project. `coil-svg` is what makes an
# agent's sanitised `svg` drawable as a *picture* — decoded to a bitmap, never
# handed to anything that can execute, fetch or navigate. `coil-network-okhttp`
# makes it reuse the app's own OkHttp client, so an image request carries the
# same timeouts and the same auth rule as every other request and cannot reach
# any host but the one the user configured.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# The scanner. `camera-view` carries `PreviewView`, `camera-lifecycle` binds the
# use cases to a `LifecycleOwner` so the camera is released the moment the screen
# leaves, and `camera-camera2` is the backend that actually opens the device.
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
